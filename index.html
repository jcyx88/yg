<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>杨过游戏目录</title>
  <meta name="description" content="杨过游戏目录：游戏名称检索、精选展示和联系方式。" />
  <link rel="canonical" href="https://99u.xyz/" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header>
    <h1>杨过游戏目录</h1>

    <div class="sub">
      <div class="panel" role="search">
        <div class="form">
          <div>
            <label for="gameSelect">下拉选择游戏</label>
            <select id="gameSelect" aria-label="选择游戏">
              <option value="" selected>加载中...</option>
            </select>
          </div>

          <div>
            <label for="keyword">搜索游戏名称</label>
            <input id="keyword" type="text" placeholder="例如：学院 / Summer / 物语 ..." autocomplete="off" />
          </div>
        </div>

        <div class="hint">
          共 <b id="totalCount">0</b> 个条目；精选展示可在 <code class="kbd">assets/app.js</code> 里调整。
          <br/>
          如需了解更多信息，请联系管理员。
        </div>

        <div class="actions" style="margin-top:12px;">
          <button class="btn secondary" id="resetBtn" type="button">重置筛选</button>
        </div>
      </div>
    </div>
  </header>

  <main class="section" aria-label="精选游戏">
    <h2>精选展示（点击卡片复制联系方式）</h2>
    <div class="grid" id="gameList" aria-live="polite"></div>
  </main>

  <footer>
    <div>联系管理员：1080034594</div>
    <div style="margin-top:6px;">二维码图片：<code class="kbd">/weixin-qr.png</code> / <code class="kbd">/alipay-qr.png</code></div>
  </footer>

  <!-- 固定底部联系栏 -->
  <div class="paybar" role="contentinfo" aria-label="联系方式">
    <div class="paybar-inner">
      <div class="paybar-left">
        <div class="t1">联系管理员：1080034594</div>
        <div class="t2">如需了解目录内容和更新信息，请通过二维码或联系方式咨询。</div>
      </div>

      <div class="paybar-qrs">
        <div class="qr">
          <img src="./weixin-qr.png" alt="联系方式二维码" loading="lazy" />
          <div class="lbl">联系二维码</div>
        </div>
        <div class="qr">
          <img src="./alipay-qr.png" alt="备用联系方式二维码" loading="lazy" />
          <div class="lbl">备用二维码</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="copyBtn" type="button">复制联系方式</button>
        <button class="btn secondary" id="toTopBtn" type="button">回到顶部</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="./assets/app.js" defer></script>
</body>
</html>
